name: Backend

# Runs only when backend code, the Render blueprint, or this workflow changes.
# A frontend-only commit will not start this workflow at all.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  # Lets you redeploy the backend from the Actions tab without pushing a commit.
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/anchryn-api

    services:
      postgres:
        # pgvector/pgvector, not plain postgres: the schema creates a vector
        # column and an HNSW index, neither of which exists without the extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: anchryn
          POSTGRES_USER: anchryn
          POSTGRES_PASSWORD: anchryn_dev_pw
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U anchryn -d anchryn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://anchryn:anchryn_dev_pw@localhost:5434/anchryn
      # Tests never reach Hugging Face: generation is stubbed, and the only
      # /api/answer case is the refusal path, which returns before any call.
      HF_TOKEN: ''
      JWT_SECRET: test-only-signing-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/anchryn-api/requirements.txt
            backend/anchryn-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The embedding model is ~67MB and the tests genuinely run it rather than
      # mocking it. Cached so only the first run on a new lockfile downloads it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a broken Dockerfile here rather than halfway through a deploy.
      - name: Build image
        run: docker build -f backend/anchryn-api/Dockerfile backend/anchryn-api

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Fail if the deploy hook is missing
        if: env.RENDER_DEPLOY_HOOK == ''
        run: |
          echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
          echo "Add it under Settings -> Secrets and variables -> Actions,"
          echo "or turn Render's own Auto-Deploy back on and delete this job."
          exit 1

      - name: Trigger Render deploy
        run: curl -fsSL --retry 3 -X POST "$RENDER_DEPLOY_HOOK"

      - name: Summary
        run: echo "Backend deploy triggered on Render." >> "$GITHUB_STEP_SUMMARY"
