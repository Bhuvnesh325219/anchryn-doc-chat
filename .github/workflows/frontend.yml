name: Frontend

# Tests only. Vercel deploys the frontend itself, through its Git integration.
#
# An earlier version deployed from here with the Vercel CLI, which needs three
# secrets (token, org id, project id) and fails with an opaque "Could not
# retrieve Project Settings" when any one of them is wrong. Vercel's own
# integration needs none of them, and per-side filtering is done with an
# Ignored Build Step instead — see DEPLOYMENT.md.
#
# The tradeoff: a push deploys whether or not these tests passed. If that
# matters more than the simplicity, git history has the CLI version.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/anchryn-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/anchryn-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          # Karma's ChromeHeadless launcher needs to be told where Chrome is.
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # The same build Vercel runs, so a compile error is caught here too rather
      # than only showing up in the Vercel dashboard.
      - name: Production build
        run: npm run build
