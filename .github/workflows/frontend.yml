name: Frontend

# Runs only when frontend code or this workflow changes.
# A backend-only commit will not start this workflow at all.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/anchryn-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/anchryn-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          # Karma's ChromeHeadless launcher needs to be told where Chrome is.
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: frontend/anchryn-web
    environment:
      name: production-frontend
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The CLI reads these two from the environment automatically.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Checkout first: every later run step uses the working-directory above,
      # which does not exist until the repo is on disk.
      - uses: actions/checkout@v4

      - name: Fail if Vercel credentials are missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: |
          echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must all be set."
          echo "See DEPLOYMENT.md for where to find each one."
          exit 1

      # "Could not retrieve Project Settings" from `vercel pull` gives no hint as
      # to which value is wrong. Checking the shapes first turns the two most
      # common mistakes — swapping the secrets, or pasting a project id from a
      # different project — into a message that says so.
      - name: Check the credential shapes
        run: |
          fail=0
          case "$VERCEL_PROJECT_ID" in
            prj_*) ;;
            team_*) echo "::error::VERCEL_PROJECT_ID starts with 'team_' — the two secrets are swapped."; fail=1 ;;
            *) echo "::error::VERCEL_PROJECT_ID should start with 'prj_'. Re-read .vercel/project.json."; fail=1 ;;
          esac
          case "$VERCEL_ORG_ID" in
            prj_*) echo "::error::VERCEL_ORG_ID starts with 'prj_' — the two secrets are swapped."; fail=1 ;;
            *) ;;
          esac
          if [ "$fail" = "0" ]; then
            echo "Shapes look right (project ${VERCEL_PROJECT_ID%${VERCEL_PROJECT_ID#prj_????}}…)."
            echo "If the pull still fails, the ids are well-formed but do not belong to"
            echo "this token's account, or the project is under a team the token cannot see."
          fi
          exit "$fail"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/anchryn-web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Building here rather than on Vercel means the deploy is exactly the
      # artifact CI just tested, and Vercel build minutes are not spent.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
